<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Курс на месте</title>
<meta name="description" content="Наводишь камеру на ценник — видишь цену в рублях. Донг, бат, лира, юань, дирхам, лари и другие.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Курс">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#F2F3F7;
    --card:#FFFFFF;
    --card-2:#F6F7FA;
    --label:#0B0E12;
    --label-2:#5C6673;
    --label-3:#8D96A3;
    --sep:rgba(60,70,85,.13);
    --tint:#0A8FA8;
    --tint-ink:#07778C;
    --tint-soft:#E2F3F7;
    --on-tint:#FFFFFF;
    --good:#1B9E6A;
    --warn:#B4681A;
    --key:#FFFFFF;
    --key-2:#E6E9EF;
    --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --card:#13171B;
      --card-2:#1B2026;
      --label:#F3F6F8;
      --label-2:#A2ACB8;
      --label-3:#6E7885;
      --sep:rgba(255,255,255,.11);
      --tint:#34C4DE;
      --tint-ink:#5ED6EC;
      --tint-soft:#0C2A31;
      --on-tint:#04252B;
      --good:#37D18C;
      --warn:#E3A34B;
      --key:#1C2126;
      --key-2:#2A3138;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#13171B; --card-2:#1B2026;
    --label:#F3F6F8; --label-2:#A2ACB8; --label-3:#6E7885;
    --sep:rgba(255,255,255,.11);
    --tint:#34C4DE; --tint-ink:#5ED6EC; --tint-soft:#0C2A31; --on-tint:#04252B;
    --good:#37D18C; --warn:#E3A34B; --key:#1C2126; --key-2:#2A3138;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{touch-action:manipulation;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--label);
    font-family:var(--ui);font-size:16px;line-height:1.45;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
    font-variant-numeric:tabular-nums;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}

  .wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 44px;display:flex;flex-direction:column;gap:22px}

  /* заголовок */
  .nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 2px}
  .nav h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.024em}
  .ratepill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--tint-soft);color:var(--tint-ink);
    border-radius:999px;padding:6px 12px;
    font-size:13px;font-weight:600;white-space:nowrap;margin-bottom:4px;
  }
  .ratepill .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
  .ratepill.offline .dot{background:var(--label-3)}
  .ratepill.custom .dot{background:var(--warn)}

  /* выбор валюты */
  .curbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px 4px}
  .curbar::-webkit-scrollbar{display:none}
  .cur{
    flex:none;background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:600;color:var(--label-2);
    display:flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .15s ease,color .15s ease;
  }
  .cur .s{font-weight:700;color:var(--label-3)}
  .cur[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
  .cur[aria-pressed="true"] .s{color:var(--on-tint);opacity:.72}

  /* карточка конвертера */
  .card{background:var(--card);border-radius:18px;overflow:hidden}
  .conv{position:relative}
  .side{padding:16px 18px 18px;display:flex;flex-direction:column;gap:3px}
  .side + .side{border-top:1px solid var(--sep)}
  .side .cap{font-size:13px;font-weight:500;color:var(--label-2);display:flex;align-items:center;gap:6px}
  .side .cap b{font-weight:600;color:var(--label)}
  .amount{display:flex;align-items:baseline;gap:8px;min-width:0}
  .amount .v{
    flex:1;min-width:0;width:100%;
    font-size:clamp(34px,10.5vw,44px);font-weight:600;letter-spacing:-.03em;
    line-height:1.15;color:var(--label);
    border:0;background:transparent;padding:0;margin:0;
    appearance:none;-webkit-appearance:none;
    font-variant-numeric:tabular-nums;font-family:inherit;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    caret-color:var(--tint);
  }
  .amount .v:focus{outline:none}
  .amount .v::selection{background:var(--tint);color:var(--on-tint)}
  .amount .sym{font-size:20px;font-weight:600;color:var(--label-3);flex:none}
  .swapbtn{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border-radius:50%;
    background:var(--tint);color:var(--on-tint);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px -2px rgba(10,143,168,.5);
    z-index:2;
  }
  .swapbtn:active{transform:translateY(-50%) scale(.92)}

  /* кнопки */
  .actions{display:flex;gap:10px}
  .btn{
    flex:1;background:var(--card);border-radius:14px;padding:14px 16px;
    font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn.filled{background:var(--tint);color:var(--on-tint)}
  .btn.grow{flex:2}
  .btn:active{opacity:.75}

  .note{
    background:var(--card);border-radius:14px;padding:13px 16px;
    font-size:14px;color:var(--label-2);display:flex;flex-direction:column;gap:9px;
  }
  .note .h{font-weight:600;color:var(--label);font-size:15px}
  .note.bad .h{color:var(--warn)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    background:var(--card-2);border-radius:999px;padding:7px 13px;
    font-size:14px;font-weight:600;color:var(--label);
  }
  .chip.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep);color:var(--label-2)}

  /* клавиатура */
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .key{
    background:var(--key);border-radius:15px;min-height:56px;
    font-size:24px;font-weight:500;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .key:active{background:var(--key-2)}
  .key.alt{background:var(--key-2);font-size:17px;font-weight:600;color:var(--label-2)}
  .key.w2{grid-column:span 2}

  /* списки */
  .group{display:flex;flex-direction:column;gap:8px}
  .group > h2{
    margin:0 0 -2px 16px;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;color:var(--label-3);
  }
  .list{background:var(--card);border-radius:14px;overflow:hidden}
  .row{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;width:100%;text-align:left;font-size:16px;
  }
  .row + .row{box-shadow:inset 0 1px 0 var(--sep)}
  .row .grow{flex:1;min-width:0}
  .row .sub{display:block;font-size:13px;color:var(--label-3);font-weight:400}
  .row .val{color:var(--label-2);font-weight:500;white-space:nowrap}
  .row .val b{color:var(--label);font-weight:600}
  .sw{width:26px;height:17px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}

  .field{display:flex;align-items:center;gap:12px;padding:11px 16px}
  .field label{font-size:15px;color:var(--label-2);flex:none;min-width:132px}
  .field input{
    flex:1;min-width:0;font-family:inherit;font-size:17px;font-weight:600;
    border:0;background:transparent;color:var(--label);text-align:right;padding:4px 0;
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{outline:none}
  .field + .field{box-shadow:inset 0 1px 0 var(--sep)}
  .hint{margin:0;font-size:13px;line-height:1.45;color:var(--label-3);padding-inline:16px}

  footer{font-size:13px;color:var(--label-3);text-align:center;line-height:1.6}
  footer button{color:var(--tint-ink);font-size:13px;font-weight:500}

  /* камера */
  .ov{position:fixed;inset:0;z-index:100;background:#05090B;display:flex;flex-direction:column;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .stage video{width:100%;height:100%;object-fit:cover;background:#05090B}
  .ret{position:absolute;left:7%;right:7%;top:36%;height:20%;
       border:2.5px solid rgba(255,255,255,.92);border-radius:14px;
       box-shadow:0 0 0 2000px rgba(5,9,11,.5);pointer-events:none;transition:border-color .2s}
  .ret.hit{border-color:#4FE0C0}
  .tip{position:absolute;left:0;right:0;top:calc(36% - 32px);text-align:center;color:#fff;
       font-size:13px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none;padding-inline:20px}
  .live{position:absolute;left:0;right:0;top:60%;text-align:center;color:#fff;pointer-events:none;
        padding-inline:16px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .live .a{font-size:19px;font-weight:600;opacity:.92}
  .live .b{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .live .c{font-size:13px;opacity:.8;margin-top:3px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px 20px;background:#05090B}
  .shut{width:70px;height:70px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28);flex:none}
  .shut:active{transform:scale(.93)}
  .shut[disabled]{opacity:.4}
  .ovb{color:#fff;font-size:16px;padding:10px;min-width:88px;font-weight:500}
  .ovb.r{text-align:right}
  .ovmsg{color:#fff;font-size:15px;text-align:center;padding:26px;max-width:340px;line-height:1.5}
  .dbg{position:absolute;left:10px;right:10px;bottom:8px;color:#6FE3C4;font:11px/1.35 ui-monospace,Menlo,monospace;
       word-break:break-all;pointer-events:none;text-shadow:0 1px 2px #000}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <h1>Курс</h1>
    <button class="ratepill" id="ratePill" type="button"><span class="dot"></span><span id="ratePillText">—</span></button>
  </div>

  <div class="curbar" id="curbar"></div>

  <div class="card conv">
    <button class="swapbtn" id="swap" type="button" aria-label="Поменять местами">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v13M7 17l-3-3M7 17l3-3M17 20V7M17 7l-3 3M17 7l3 3"/></svg>
    </button>
    <div class="side">
      <span class="cap" id="capFrom"></span>
      <div class="amount">
        <input class="v" id="inAmount" type="text" inputmode="decimal" autocomplete="off"
               autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Сумма">
        <span class="sym" id="symFrom"></span>
      </div>
    </div>
    <div class="side">
      <span class="cap" id="capTo"></span>
      <div class="amount">
        <span class="v" id="outAmount">0</span>
        <span class="sym" id="symTo"></span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn filled grow" id="scanBtn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V6.5A3.5 3.5 0 0 1 6.5 3H9M15 3h2.5A3.5 3.5 0 0 1 21 6.5V9M21 15v2.5a3.5 3.5 0 0 1-3.5 3.5H15M9 21H6.5A3.5 3.5 0 0 1 3 17.5V15"/><circle cx="12" cy="12" r="3.2"/></svg>
      Навести камеру
    </button>
    <button class="btn" id="photoBtn" type="button">Фото</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>

  <div class="note" id="scanOut" hidden></div>

  <div class="pad" id="pad"></div>

  <div class="chips" id="quick"></div>

  <div class="group">
    <h2>Курс</h2>
    <div class="list">
      <div class="field">
        <label for="rateIn" id="rateInLbl">Единиц за рубль</label>
        <input id="rateIn" inputmode="decimal" placeholder="—">
      </div>
      <div class="field">
        <label for="gaveIn">Отдал, ₽</label>
        <input id="gaveIn" inputmode="numeric" placeholder="10000">
      </div>
      <div class="field">
        <label for="gotIn" id="gotLbl">Получил</label>
        <input id="gotIn" inputmode="numeric" placeholder="—">
      </div>
    </div>
    <p class="hint" id="rateHint"></p>
    <div class="chips">
      <button class="chip" id="saveRate" type="button">Сохранить свой курс</button>
      <button class="chip out" id="dropRate" type="button">Курс из сети</button>
    </div>
  </div>

  <div class="group" id="notesGroup" hidden>
    <h2 id="notesTitle">Купюры</h2>
    <div class="list" id="notesList"></div>
    <p class="hint" id="notesWarn"></p>
  </div>

  <div class="group">
    <h2>История</h2>
    <div id="histWrap"></div>
  </div>

  <footer>
    <div id="footVer"></div>
    <div style="margin-top:4px">
      <button type="button" id="updBtn">проверить обновление</button> ·
      <button type="button" id="dbgBtn">показать распознанный текст</button>
    </div>
  </footer>
</div>

<div class="ov" id="ov" hidden>
  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div class="ret" id="ret"></div>
    <div class="tip" id="tip">Наведите рамку на цену</div>
    <div class="live" id="live" hidden>
      <div class="a" id="liveA"></div>
      <div class="b" id="liveB"></div>
      <div class="c" id="liveC"></div>
    </div>
    <div class="ovmsg" id="ovMsg" hidden></div>
    <div class="dbg" id="dbg" hidden></div>
  </div>
  <div class="bar">
    <button class="ovb" id="ovClose" type="button">Закрыть</button>
    <button class="shut" id="shut" type="button" aria-label="Взять цену"></button>
    <button class="ovb r" id="ovTorch" type="button" hidden>Фонарь</button>
  </div>
</div>

<script src="ocr/tesseract.min.js"></script>
<script>
(function(){
"use strict";

var APP_VERSION = "8";
var APP_DATE = "21.09.2026";
var LS = "curr.v1.";
var WHITELIST = "0123456789., ktrKTRjb";

/* ======================= валюты =======================
   big  — цены целыми, без копеек (донг, рупия, драм, тенге, сум, динар)
   menuK— голое двузначное число в меню значит тысячи (35 → 35 000)
   k/mil— местные сокращения тысяч и миллионов
   fb   — запасной курс: единиц за рубль, по ЦБ на 19.09.2026            */
var CUR = [
  {c:"VND",n:"Вьетнам",u:"донг",   s:"₫",  big:true,  menuK:true, k:["k","ngan","ngàn","nghin","nghìn"], mil:["tr","trieu","triệu"], fb:304.5},
  {c:"THB",n:"Таиланд",u:"бат",    s:"฿",  big:false, fb:0.3952},
  {c:"TRY",n:"Турция", u:"лира",   s:"₺",  big:false, fb:0.5776},
  {c:"CNY",n:"Китай",  u:"юань",   s:"¥",  big:false, fb:0.07957},
  {c:"AED",n:"ОАЭ",    u:"дирхам", s:"dh", big:false, fb:0.04362},
  {c:"GEL",n:"Грузия", u:"лари",   s:"₾",  big:false, fb:0.03097},
  {c:"AMD",n:"Армения",u:"драм",   s:"֏",  big:true,  fb:4.316},
  {c:"KZT",n:"Казахстан",u:"тенге",s:"₸",  big:true,  fb:5.280},
  {c:"IDR",n:"Индонезия",u:"рупия",s:"Rp", big:true,  menuK:true, k:["k","rb","ribu"], mil:["jt","juta"], fb:210.9},
  {c:"UZS",n:"Узбекистан",u:"сум", s:"сўм",big:true,  fb:140.5},
  {c:"EGP",n:"Египет", u:"фунт",   s:"E£", big:false, fb:0.6193},
  {c:"RSD",n:"Сербия", u:"динар",  s:"дин",big:true,  fb:1.214},
  {c:"INR",n:"Индия",  u:"рупия",  s:"₹",  big:false, fb:1.138},
  {c:"USD",n:"США",    u:"доллар", s:"$",  big:false, fb:0.01188},
  {c:"EUR",n:"Европа", u:"евро",   s:"€",  big:false, fb:0.01035}
];
var BY = {}; CUR.forEach(function(x){ BY[x.c] = x; });

var VND_NOTES = [
  {v:500000,c:"#5FA79B",n:"полимер, бирюзово-синяя"},
  {v:200000,c:"#C2603F",n:"полимер, рыже-красная"},
  {v:100000,c:"#6FA86C",n:"полимер, зелёная"},
  {v:50000, c:"#D98BA0",n:"полимер, розовая"},
  {v:20000, c:"#6E9BC4",n:"полимер, голубая"},
  {v:10000, c:"#C79A55",n:"полимер, жёлто-коричневая"},
  {v:5000,  c:"#7E7FB0",n:"бумага, сине-фиолетовая"},
  {v:2000,  c:"#B87C6A",n:"бумага, кирпичная"},
  {v:1000,  c:"#8FA38C",n:"бумага, серо-зелёная"}
];

/* ======================= хранилище ======================= */
function get(k,d){ try{var v=localStorage.getItem(LS+k);return v===null?d:JSON.parse(v);}catch(e){return d;} }
function set(k,v){ try{localStorage.setItem(LS+k,JSON.stringify(v));}catch(e){} }

var state = {
  code: BY[String(get("code","VND"))] ? String(get("code","VND")) : "VND",
  input: String(get("input","150000")),
  rev: !!get("rev",false),            // true — считаем из рублей в валюту
  net: get("net",{}) || {},           // курсы из сети: единиц за рубль
  netAt: Number(get("netAt",0))||0,
  mine: get("mine",{}) || {},         // свои курсы обмена по валютам
  hist: Array.isArray(get("hist",[])) ? get("hist",[]) : [],
  debug: !!get("debug",false)
};
function cur(){ return BY[state.code]; }
function rate(){
  var c = state.code;
  return Number(state.mine[c]) > 0 ? Number(state.mine[c])
       : Number(state.net[c])  > 0 ? Number(state.net[c])
       : cur().fb;
}
function rateKind(){
  if(Number(state.mine[state.code]) > 0) return "свой";
  if(Number(state.net[state.code]) > 0) return "сеть";
  return "офлайн";
}

/* ======================= числа ======================= */
var NBSP = " ";
function group(s){
  s = String(s).replace(/\D/g,"");
  if(!s) return "";
  s = s.replace(/^0+(?=\d)/,"");
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}
function fmtAmount(v, c){
  if(!isFinite(v)) return "0";
  var dec = c.big ? 0 : (Math.abs(v) < 1000 ? 2 : 0);
  var s = v.toFixed(dec);
  var p = s.split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  if(p[1]) p[1] = p[1].replace(/0+$/,"");
  return p[1] ? p[0] + "," + p[1] : p[0];
}
function fmtRub(v){
  if(!isFinite(v)) return "0";
  var a = Math.abs(v), s;
  if(a === 0) s = "0";
  else if(a < 10) s = v.toFixed(2).replace(/\.?0+$/,"");
  else if(a < 1000) s = v.toFixed(1).replace(/\.0$/,"");
  else s = String(Math.round(v));
  var p = s.split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return p.join(",");
}
function fmtRate(r){
  if(r >= 100) return String(Math.round(r));
  if(r >= 1)   return (Math.round(r*100)/100).toFixed(2).replace(/\.?0+$/,"").replace(".",",");
  return (Math.round(r*100000)/100000).toFixed(5).replace(/0+$/,"").replace(/\.$/,"").replace(".",",");
}
function typedValue(){
  var s = state.input.replace(/\s/g,"").replace(",",".");
  var v = parseFloat(s);
  return isFinite(v) ? v : 0;
}
function fmtTyped(){
  var parts = state.input.split(",");
  var out = group(parts[0]) || (parts.length > 1 ? "0" : "");
  if(parts.length > 1) out += "," + parts[1].replace(/\D/g,"").slice(0,2);
  return out;
}
function parseLoose(str){
  if(str == null) return NaN;
  var s = String(str).trim().replace(/[\s  ]/g,"").replace(",",".");
  var v = parseFloat(s);
  return isFinite(v) ? v : NaN;
}

/* ======================= разбор цены с ценника =======================
   Ключевое различие: во Вьетнаме «150.000» — это сто пятьдесят тысяч,
   а в Турции «12,50» — это двенадцать с половиной. Решает длина хвоста
   после последнего разделителя: три цифры — разряды, одна-две — копейки. */
function parsePrices(raw, c){
  if(!raw) return [];
  c = c || cur();
  var t = String(raw).toLowerCase().replace(/[\t\n\r]/g," ");
  t = t.replace(/[оo]/g,"0").replace(/[l|]/g,"1");
  t = t.replace(/vn[dđ]?/g," ").replace(/[₫đ]/g," ");
  t = t.replace(/[^0-9.,a-zà-ỹ ]/g," ");

  var out = [], ord = 0;
  function scan(re, w, how, make){
    var m, spans = [];
    re.lastIndex = 0;
    while((m = re.exec(t))){
      var v = make(m);
      if(isFinite(v) && v > 0) out.push({v:v, w:w, how:how, ord:ord++});
      spans.push([m.index, m[0].length]);
    }
    for(var i = spans.length-1; i >= 0; i--){
      t = t.slice(0,spans[i][0]) + new Array(spans[i][1]+1).join(" ") + t.slice(spans[i][0]+spans[i][1]);
    }
  }

  if(c.big){
    if(c.mil){
      scan(new RegExp("(\\d+)[.,](\\d{1,3})\\s*("+c.mil.join("|")+")","g"), 8, "млн", function(m){
        return Math.round(parseFloat(m[1]+"."+m[2]) * 1000000);
      });
      scan(new RegExp("(\\d+)\\s*("+c.mil.join("|")+")\\s*(\\d)?","g"), 8, "млн", function(m){
        return parseInt(m[1],10)*1000000 + (m[3] ? parseInt(m[3],10)*100000 : 0);
      });
    }
    if(c.k){
      scan(new RegExp("(\\d{1,4})\\s*("+c.k.join("|")+")(?![a-zà-ỹ0-9])","g"), 8, "тыс.", function(m){
        return parseInt(m[1],10)*1000;
      });
    }
    // 38 490 000 · 150.000 · 1,500,000 — хвост \d* это прилипший знак валюты
    scan(/(\d{1,3})((?:[ .,]\d{3})+)(\d*)/g, 7, "разряды", function(m){
      return parseInt(m[1] + m[2].replace(/[ .,]/g,""), 10);
    });
    scan(/(?:^|[^0-9])(\d{4,9})(?![0-9])/g, 4, "число", function(m){ return parseInt(m[1],10); });
    if(c.menuK){
      scan(/(?:^|[^0-9])(\d{2,3})(?![0-9])/g, 1, "меню ×1000", function(m){ return parseInt(m[1],10)*1000; });
    }
  }else{
    // 1.234,56 и 1 234.56 — разряды плюс копейки
    scan(/(\d{1,3}(?:[ .,]\d{3})+)([.,]\d{1,2})(?![0-9])/g, 8, "с копейками", function(m){
      return parseFloat(m[1].replace(/[ .,]/g,"") + "." + m[2].slice(1));
    });
    // 1.250 · 12 500 — только разряды
    scan(/(\d{1,3}(?:[ .,]\d{3})+)(?![0-9])/g, 7, "разряды", function(m){
      return parseInt(m[1].replace(/[ .,]/g,""), 10);
    });
    // 12,50 — копейки
    scan(/(\d{1,6})[.,](\d{1,2})(?![0-9])/g, 6, "с копейками", function(m){
      return parseFloat(m[1] + "." + m[2]);
    });
    scan(/(?:^|[^0-9.,])(\d{1,6})(?![0-9.,])/g, 4, "число", function(m){ return parseInt(m[1],10); });
  }

  var lo = c.big ? 1000 : 1, hi = c.big ? 900000000 : 9999999;
  var seen = {}, res = [];
  out.forEach(function(o){
    if(!isFinite(o.v) || o.v < lo || o.v > hi) return;
    if(seen[o.v]){ if(o.w > seen[o.v].w) seen[o.v].w = o.w; return; }
    seen[o.v] = o; res.push(o);
  });
  var solid = res.some(function(o){ return o.w >= 4; });
  if(solid) res = res.filter(function(o){ return o.w >= 4; });
  res.sort(function(a,b){ return (b.w - a.w) || (a.ord - b.ord); });
  return res;
}

  return p(d.getDate()) + "." + p(d.getMonth()+1);
}

function reformat(el){
  var start = el.selectionStart == null ? el.value.length : el.selectionStart;
  var before = el.value.slice(0,start).replace(/[^\d,]/g,"").length;
  var raw = el.value.replace(/[^\d,]/g,"");
  var parts = raw.split(",");
  var clean = parts[0].replace(/^0+(?=\d)/,"").slice(0,12);
  if(parts.length > 1 && !cur().big) clean += "," + parts[1].replace(/\D/g,"").slice(0,2);
  state.input = clean;
  var text = fmtTyped();
  el.value = text;
  var pos = 0, seen = 0;
  while(pos < text.length && seen < before){
    var ch = text.charAt(pos);
    if((ch >= "0" && ch <= "9") || ch === ",") seen++;
    pos++;
  }
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}

function fetchRates(force){
  if(!force && state.netAt && Date.now() - state.netAt < 6*3600*1000) return;
  var codes = CUR.map(function(c){ return c.c; });
  var srcs = [
    { url:"https://open.er-api.com/v6/latest/RUB", pick:function(d){
        if(!d || !d.rates) return null;
        var o = {}; codes.forEach(function(c){ if(d.rates[c] > 0) o[c] = d.rates[c]; });
        return Object.keys(o).length ? o : null;
      } },
    { url:"https://www.cbr-xml-daily.ru/daily_json.js", pick:function(d){
        if(!d || !d.Valute) return null;
        var o = {}; codes.forEach(function(c){
          var v = d.Valute[c];
          if(v && v.Value > 0) o[c] = v.Nominal / v.Value;
        });
        return Object.keys(o).length ? o : null;
      } }
  ];
  (function next(i){
    if(i >= srcs.length) return;
    fetch(srcs[i].url, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        var o = srcs[i].pick(d);
        if(!o) throw 0;
        state.net = o; state.netAt = Date.now();
        set("net", o); set("netAt", state.netAt);
        render();
      })
      .catch(function(){ next(i+1); });
  })(0);
}

function boxBlurGray(src,w,h,r){
  var tmp=new Uint8ClampedArray(w*h), out=new Uint8ClampedArray(w*h), x,y,i,sum,n;
  for(y=0;y<h;y++){
    var row=y*w; sum=0; n=0;
    for(i=0;i<=r&&i<w;i++){ sum+=src[row+i]; n++; }
    for(x=0;x<w;x++){
      tmp[row+x]=sum/n;
      var a=x+r+1, b=x-r;
      if(a<w){ sum+=src[row+a]; n++; }
      if(b>=0){ sum-=src[row+b]; n--; }
    }
  }
  for(x=0;x<w;x++){
    sum=0; n=0;
    for(i=0;i<=r&&i<h;i++){ sum+=tmp[i*w+x]; n++; }
    for(y=0;y<h;y++){
      out[y*w+x]=sum/n;
      var ay=y+r+1, by=y-r;
      if(ay<h){ sum+=tmp[ay*w+x]; n++; }
      if(by>=0){ sum-=tmp[by*w+x]; n--; }
    }
  }
  return out;
}
function prepCanvas(src, sw, sh, box, o){
  o = o || {};
  var binarize = o.binarize !== false, blurR = o.blur === undefined ? 2 : o.blur, target = o.target || 1100;
  var cw = Math.max(1, Math.round(sw*box.w)), ch = Math.max(1, Math.round(sh*box.h));
  var sx = Math.max(0, Math.round(sw*box.x)), sy = Math.max(0, Math.round(sh*box.y));
  var scale = Math.min(3, Math.max(1, target/cw));
  var c = document.createElement("canvas");
  c.width = Math.round(cw*scale); c.height = Math.round(ch*scale);
  var ctx = c.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, sx, sy, cw, ch, 0, 0, c.width, c.height);

  var W=c.width, H=c.height, N=W*H;
  var img = ctx.getImageData(0,0,W,H), p = img.data;
  var gray = new Uint8ClampedArray(N), i, j, sum=0;
  for(i=0,j=0;j<N;i+=4,j++){ gray[j]=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0; sum+=gray[j]; }
  var mean = sum/N;
  if(blurR > 0){ gray = boxBlurGray(gray,W,H,blurR); gray = boxBlurGray(gray,W,H,blurR); }

  var hist = new Array(256); for(i=0;i<256;i++) hist[i]=0;
  for(j=0;j<N;j++) hist[gray[j]]++;
  var sumAll=0,t; for(t=0;t<256;t++) sumAll+=t*hist[t];
  var sumB=0,wB=0,best=-1,thr=128,wF,mB,mF,bet;
  for(t=0;t<256;t++){
    wB+=hist[t]; if(!wB) continue;
    wF=N-wB; if(!wF) break;
    sumB+=t*hist[t];
    mB=sumB/wB; mF=(sumAll-sumB)/wF;
    bet=wB*wF*(mB-mF)*(mB-mF);
    if(bet>best){ best=bet; thr=t; }
  }
  var invert = mean < 118;
  for(i=0,j=0;j<N;i+=4,j++){
    var v;
    if(binarize){ var on = gray[j] > thr; if(invert) on = !on; v = on ? 255 : 0; }
    else { v = invert ? 255-gray[j] : gray[j]; }
    p[i]=p[i+1]=p[i+2]=v; p[i+3]=255;
  }
  ctx.putImageData(img,0,0);

  var pad = 24;
  var out = document.createElement("canvas");
  out.width = W+pad*2; out.height = H+pad*2;
  var o2 = out.getContext("2d");
  o2.fillStyle = "#fff"; o2.fillRect(0,0,out.width,out.height);
  o2.drawImage(c,pad,pad);
  return out;
}

/* ======================= распознавание ======================= */
var worker = null, workerPromise = null;
function getWorker(){
  if(workerPromise) return workerPromise;
  if(typeof Tesseract === "undefined"){
    workerPromise = Promise.reject(new Error("Движок распознавания не загрузился."));
    return workerPromise;
  }
  // всё локальное: ни одного обращения наружу — важно там, где CDN недоступны
  workerPromise = Tesseract.createWorker("eng", 1, {
    workerPath: "ocr/worker.min.js",
    corePath: "ocr/core",
    langPath: "ocr/lang",
    gzip: true
  }).then(function(w){
    return w.setParameters({
      tessedit_char_whitelist: WHITELIST,
      tessedit_pageseg_mode: "6",
      preserve_interword_spaces: "1",
      classify_bln_numeric_mode: "1"
    }).then(function(){ worker = w; return w; });
  });
  return workerPromise;
}

var ov=$("ov"), video=$("video"), stream=null, track=null;
var scanning=false, best=null, frames=[], lastList=null, lastText="", emptyRun=0;
var BOX = {x:0.07,y:0.36,w:0.86,h:0.20};
var WINDOW=7, NEED_SHOW=2, NEED_TAKE=3;

function retInVideo(){
  var vw=video.videoWidth, vh=video.videoHeight;
  var el=$("stage"), rw=el.clientWidth, rh=el.clientHeight;
  if(!vw||!vh||!rw||!rh) return BOX;
  var sc = Math.max(rw/vw, rh/vh);
  var ox = (vw*sc-rw)/2, oy = (vh*sc-rh)/2;
  var x=(BOX.x*rw+ox)/sc/vw, y=(BOX.y*rh+oy)/sc/vh;
  var w=(BOX.w*rw)/sc/vw, h=(BOX.h*rh)/sc/vh;
  x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
  return {x:x,y:y,w:Math.min(w,1-x),h:Math.min(h,1-y)};
}

function showScan(html, bad){
  var el=$("scanOut"); el.hidden=false;
  el.className = "note" + (bad ? " bad" : "");
  el.innerHTML = html;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

function openCam(){
  ov.hidden=false; $("ovMsg").hidden=true; $("ret").hidden=false;
  $("tip").hidden=false; video.hidden=false; $("live").hidden=true;
  $("dbg").hidden=!state.debug;
  best=null; frames=[]; lastList=null; emptyRun=0;
  $("shut").disabled=true; $("tip").textContent="Наведите рамку на цену";

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return camFail("Этот браузер не показывает камеру. Нажмите «Фото» — снимок распознаётся так же.");
  }
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}, audio:false
  }).then(function(s){
    stream=s; track=s.getVideoTracks()[0];
    video.srcObject=s;
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    $("ovTorch").hidden = !(caps && caps.torch);
    return video.play().catch(function(){});
  }).then(function(){ scanning=true; loop(); })
  .catch(function(err){
    var n = err && err.name ? err.name : "";
    camFail(n === "NotAllowedError"
      ? "Доступ к камере запрещён. Разрешите камеру для этого сайта в настройках браузера — или нажмите «Фото»."
      : "Камера не открылась (" + (n||"ошибка") + "). Нажмите «Фото» — снимок распознаётся так же.");
  });
}
function camFail(msg){
  video.hidden=true; $("ret").hidden=true; $("tip").hidden=true;
  var m=$("ovMsg"); m.hidden=false; m.textContent=msg; $("shut").disabled=true;
}
function closeCam(){
  scanning=false; ov.hidden=true;
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; track=null; }
  video.srcObject=null;
}
var torch=false;
$("ovTorch").addEventListener("click", function(){
  if(!track) return;
  torch=!torch;
  track.applyConstraints({advanced:[{torch:torch}]}).catch(function(){});
  $("ovTorch").textContent = torch ? "Фонарь вкл" : "Фонарь";
});

async function loop(){
  while(scanning){
    try{
      if(video.videoWidth){
        var c = prepCanvas(video, video.videoWidth, video.videoHeight, retInVideo(), {binarize:true, blur:2, target:1100});
        var w = await getWorker();
        if(!scanning) break;
        var res = await w.recognize(c);
        var text = (res && res.data && res.data.text) ? res.data.text.trim() : "";
        var conf = (res && res.data && typeof res.data.confidence === "number") ? res.data.confidence : 0;
        lastText = text;
        if(state.debug) $("dbg").textContent = "OCR(" + Math.round(conf) + "): " + text.replace(/\n/g," ⏎ ");
        var list = parsePrices(text);
        var strong = list.length && list[0].w >= 6;
        handleLive((strong || conf >= 45) ? list : []);
      }
    }catch(e){
      if(!scanning) break;
      camFail(e && e.message ? e.message : "Распознавание не запустилось.");
      break;
    }
    await new Promise(function(r){ setTimeout(r,120); });
  }
}

function handleLive(list){
  frames.push(list.length ? list[0].v : 0);
  if(frames.length > WINDOW) frames.shift();
  if(list.length){ lastList = list; emptyRun = 0; } else { emptyRun++; }

  var counts={}, top=0, topN=0;
  frames.forEach(function(v){ if(v) counts[v]=(counts[v]||0)+1; });
  Object.keys(counts).forEach(function(k){ if(counts[k]>topN){ topN=counts[k]; top=Number(k); } });

  if(!top || topN < NEED_SHOW){
    best=null; $("ret").classList.remove("hit"); $("shut").disabled=true; $("live").hidden=true;
    $("tip").textContent = emptyRun > 8 ? "Цифр не видно — подойдите ближе или добавьте света" : "Наведите рамку на цену";
    return;
  }
  var c = cur(), ok = topN >= NEED_TAKE;
  best = {v:top, all:(lastList||[]).map(function(o){return o.v;}).slice(0,5), how:(lastList&&lastList[0]&&lastList[0].v===top)?lastList[0].how:""};
  $("live").hidden=false;
  $("liveA").textContent = fmtAmount(top, c) + " " + c.s;
  $("liveB").textContent = fmtRub(top / rate()) + " ₽";
  $("liveC").textContent = ok ? "Нажмите, чтобы взять" : "Свожу кадры…";
  $("ret").classList.toggle("hit", ok);
  $("shut").disabled=false;
}

$("scanBtn").addEventListener("click", openCam);
$("ovClose").addEventListener("click", closeCam);
$("photoBtn").addEventListener("click", function(){ $("fileIn").click(); });
$("shut").addEventListener("click", function(){
  if(!best) return;
  apply(best.v, best.all, best.how, lastText);
  closeCam();
});
$("fileIn").addEventListener("change", function(){
  var f = this.files && this.files[0]; this.value = "";
  if(!f) return;
  closeCam(); readPhoto(f);
});

function readPhoto(file){
  showScan("<div class='h'>Читаю снимок…</div><div>Пара секунд.</div>", false);
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    getWorker().then(function(w){
      var texts = [];
      return w.setParameters({tessedit_pageseg_mode:"11", tessedit_char_whitelist:""})
        .then(function(){ return w.recognize(prepCanvas(img, img.naturalWidth, img.naturalHeight, {x:0,y:0,w:1,h:1}, {binarize:false, blur:0, target:1600})); })
        .then(function(r1){
          texts.push((r1&&r1.data&&r1.data.text)?r1.data.text:"");
          if(parsePrices(texts[0]).length) return null;
          return w.recognize(prepCanvas(img, img.naturalWidth, img.naturalHeight, {x:0,y:0,w:1,h:1}, {binarize:true, blur:2, target:1600}));
        })
        .then(function(r2){
          if(r2&&r2.data&&r2.data.text) texts.push(r2.data.text);
          return w.setParameters({tessedit_pageseg_mode:"6", tessedit_char_whitelist:WHITELIST});
        })
        .then(function(){ return texts.join("\n"); });
    }).then(function(text){
      URL.revokeObjectURL(url);
      text = (text||"").trim(); lastText = text;
      var list = parsePrices(text);
      if(!list.length){
        showScan("<div class='h'>Цену не нашёл</div><div>Снимите крупнее — цифры должны занимать хотя бы треть кадра.</div>" +
          (state.debug ? "<div style='font:11px/1.4 ui-monospace,monospace;opacity:.75'>OCR: "+esc(text.replace(/\n/g," / ")).slice(0,300)+"</div>" : ""), true);
        return;
      }
      apply(list[0].v, list.map(function(o){return o.v;}).slice(0,5), list[0].how, text);
    }).catch(function(e){
      URL.revokeObjectURL(url);
      showScan("<div class='h'>"+esc(e&&e.message?e.message:"Не получилось распознать")+"</div><div>Цену всегда можно ввести на клавиатуре.</div>", true);
    });
  };
  img.onerror = function(){ URL.revokeObjectURL(url); showScan("<div class='h'>Не открылся снимок</div>", true); };
  img.src = url;
}

function apply(v, all, how, raw){
  var c = cur();
  state.rev = false; set("rev", false);
  state.input = formatToInput(v, c);
  render(); pushHist();
  var alts = (all||[]).filter(function(x){ return x !== v; }).slice(0,4);
  var html = "<div class='h'>Прочитал " + fmtAmount(v,c) + " " + c.s +
             (how ? " <span style='font-weight:400;color:var(--label-3)'>· " + esc(how) + "</span>" : "") + "</div>";
  html += "<div class='chips' id='alts'></div>";
  if(state.debug && raw) html += "<div style='font:11px/1.4 ui-monospace,monospace;opacity:.75'>OCR: "+esc(raw.replace(/\n/g," / ")).slice(0,300)+"</div>";
  showScan(html, false);
  var box = $("alts");
  alts.forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="chip";
    b.textContent = fmtAmount(x,c) + " " + c.s;
    b.addEventListener("click", function(){ state.input = formatToInput(x,c); render(); pushHist(); });
    box.appendChild(b);
  });
  var fix=document.createElement("button"); fix.type="button"; fix.className="chip out";
  fix.textContent="Поправить"; fix.addEventListener("click", editValue);
  box.appendChild(fix);
}

/* ======================= служебное ======================= */
$("dbgBtn").addEventListener("click", function(){
  state.debug = !state.debug; set("debug", state.debug);
  $("dbgBtn").textContent = state.debug ? "скрыть распознанный текст" : "показать распознанный текст";
  $("dbg").hidden = !state.debug;
});
$("updBtn").addEventListener("click", function(){
  var b = $("updBtn"); b.textContent = "проверяю…"; b.disabled = true;
  var jobs = [];
  if("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistration().then(function(r){ return r && r.update(); }).catch(function(){}));
  if(window.caches) jobs.push(caches.keys().then(function(k){
    return Promise.all(k.filter(function(x){ return /-shell$/.test(x); }).map(function(x){ return caches.delete(x); }));
  }).catch(function(){}));
  Promise.all(jobs).then(function(){ setTimeout(function(){ location.reload(); }, 400); });
});

/* ======================= запуск ======================= */
buildCurbar(); buildPad(); buildQuick();
$("dbgBtn").textContent = state.debug ? "скрыть распознанный текст" : "показать распознанный текст";
$("footVer").textContent = "Версия " + APP_VERSION + " от " + APP_DATE + " · распознавание работает офлайн";
if(state.mine[state.code]) $("rateIn").value = fmtRate(state.mine[state.code]);
render(); renderHist(); fetchRates(false);

$("curbar").addEventListener("click", function(){ buildQuick(); });
window.addEventListener("online", function(){ fetchRates(true); });
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
setTimeout(function(){ getWorker().catch(function(){}); }, 1000);
})();
</script>
